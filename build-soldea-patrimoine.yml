name: Build Soldea Patrimoine APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer Soldea Patrimoine
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Préparer l'application Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'JSON'
          {
            "name": "soldea-patrimoine",
            "version": "1.0.0",
            "private": true,
            "description": "Soldea Patrimoine",
            "dependencies": {
              "@capacitor/android": "^7.4.3",
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "ch.soldea.patrimoine",
            "appName": "Soldea Patrimoine",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON
          npm install
          npx cap add android
          npx cap sync android
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Soldea Patrimoine</string>#' android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="title_activity_main">.*</string>#<string name="title_activity_main">Soldea Patrimoine</string>#' android/app/src/main/res/values/strings.xml

      - name: Construire l'APK Android
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Soldea-Patrimoine-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
